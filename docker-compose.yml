services:
  forum-db:
    image: postgres:17
    container_name: forum-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_OUTER_PORT}:${DB_PORT}" #export port to local postgres
    volumes:
      - forum-db-data:/var/lib/postgresql/data
    networks:
      - forum-net


  forum-redis:
    image: redis:7-alpine
    container_name: forum-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - forum-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: forum-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  forum-app:
    build: "."
    container_name: forum-backend
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: forum-db
      REDIS_HOST: forum-redis
    depends_on:
      - forum-db
      - forum-redis
    networks:
      - forum-net

volumes:
  forum-db-data:
  rabbitmq_data:
networks:
  forum-net:
